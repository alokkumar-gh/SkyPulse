services:
  backend:
    environment:
      - DEMO_MODE=true
      - SYNTHETIC_STREAM_INTERVAL_SECONDS=5

  connector-demo:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skypulse-connector-demo
    restart: unless-stopped
    command: python -m app.workers.connector_runner
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/skypulse
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - DEMO_MODE=true
      - SYNTHETIC_STREAM_INTERVAL_SECONDS=5
    depends_on:
      backend:
        condition: service_healthy

  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skypulse-ai-worker
    restart: unless-stopped
    command: python -m app.workers.ai_pipeline
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/skypulse
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=skypulse-media
      - MINIO_SECURE=false
      - DEMO_MODE=true
      - LLM_PROVIDER=disabled
    depends_on:
      backend:
        condition: service_healthy
